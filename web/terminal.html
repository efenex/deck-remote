<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Mobile-first full-screen terminal. viewport-fit=cover so we paint into the
     safe-area inset; the xterm helper textarea must stay above the home bar. -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16161e">
<title>Terminal · deck-remote</title>
<!-- OFFLINE-ONLY: vendored xterm 5.3.0 + fit addon 0.8.0. No CDN at runtime so
     the page works once the SW/browser has cached these relative assets. -->
<link rel="stylesheet" href="vendor/xterm.css">
<style>
  :root {
    --bg: #16161e;       /* xterm canvas + page background (Tokyo Night panel) */
    --chrome: #1a1b26;   /* top bar */
    --border: #2a2e42;
    --fg: #d9e2ec;
    --muted: #7a88a8;
    --accent: #7aa2f7;
    --green: #9ece6a;
    --red: #f7768e;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg); color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    overscroll-behavior: none;
  }
  #wrap {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
    /* Safe-area padding for notch / home indicator. */
    padding-top: env(safe-area-inset-top);
    padding-left: env(safe-area-inset-left);
    padding-right: env(safe-area-inset-right);
    padding-bottom: env(safe-area-inset-bottom);
  }
  #bar {
    flex: 0 0 auto;
    display: flex; align-items: center; gap: 10px;
    height: 52px; padding: 0 8px;
    background: var(--chrome);
    border-bottom: 1px solid var(--border);
    font-size: 13px;
  }
  #bar a.back {
    color: var(--accent); text-decoration: none;
    display: inline-flex; align-items: center; min-height: 44px;
    padding: 0 12px; border-radius: 10px; font-size: 15px;
    background: rgba(122,162,247,.12);
    white-space: nowrap;
  }
  #bar a.back:active { background: rgba(122,162,247,.24); }
  #sid { color: var(--muted); flex: 1; min-width: 0;
         overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #conn {
    display: inline-flex; align-items: center; gap: 6px;
    color: var(--muted); white-space: nowrap;
  }
  #led { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: 0 0 auto; }
  #conn.live #led { background: var(--green); }
  #conn.bad  #led { background: var(--red); }
  /* Terminal host: fills remaining space; xterm fits into it. */
  /* While the on-screen keyboard is up (#wrap.kb) the terminal keeps its size
     (no resize of the shared tmux pane) and is bottom-aligned, so its TOP
     rows are clipped and the input line stays just above the keyboard. */
  #term {
    flex: 1; min-height: 0; min-width: 0;
    padding: 6px 8px;
    overflow: hidden;
    background: var(--bg);
    display: flex; flex-direction: column;
  }
  #wrap.kb #term { justify-content: flex-end; }
  #term > .terminal { flex: 0 0 auto; }
  /* Keys the phone keyboard lacks. Under the header rather than above the
     keyboard: iOS positions the page differently with the keyboard up, and
     the top of the page is the part that is reliably on screen. */
  #keys {
    flex: 0 0 auto; display: flex; gap: 6px; padding: 6px 8px;
    background: var(--chrome); border-bottom: 1px solid var(--border);
    overflow-x: auto;
  }
  #keys button {
    flex: 1 0 auto; min-width: 48px; min-height: 44px; padding: 0 10px;
    border: 1px solid var(--border); border-radius: 10px;
    background: #24283b; color: var(--fg);
    font: 600 14px ui-monospace, "SF Mono", Menlo, monospace;
    -webkit-user-select: none; user-select: none; touch-action: manipulation;
  }
  #keys button:active { background: #2b3047; }
  #keys button[data-key=up], #keys button[data-key=down], #keys button[data-key=enter] { font-size: 19px; }
  /* Centered notice (no token / disconnected). */
  #notice {
    position: absolute; inset: 0;
    display: none;
    align-items: center; justify-content: center;
    padding: 24px;
    background: rgba(22,22,30,.92);
    text-align: center;
  }
  #notice.show { display: flex; }
  #notice .box { max-width: 360px; }
  #notice h2 { margin: 0 0 8px; font-size: 16px; color: var(--fg); }
  #notice p  { margin: 0 0 16px; font-size: 13.5px; color: var(--muted); line-height: 1.5; }
  #notice .btn {
    display: inline-block; cursor: pointer;
    border: 1px solid var(--border); border-radius: 10px;
    background: var(--accent); color: #0b0d17;
    font-weight: 600; font-size: 14px;
    padding: 9px 16px; text-decoration: none;
  }
  #notice .btn.ghost { background: transparent; color: var(--accent); margin-left: 8px; }
  #notice .btn:active { opacity: .85; }
</style>
</head>
<body>
<div id="wrap">
  <div id="bar">
    <a class="back" href="/">← back</a>
    <span id="sid"></span>
    <span id="conn"><span id="led"></span><span id="conntext">connecting…</span></span>
  </div>
  <div id="keys">
    <button type="button" data-key="esc">Esc</button>
    <button type="button" data-key="tab">Tab</button>
    <button type="button" data-key="ctrlc">^C</button>
    <button type="button" data-key="up">↑</button>
    <button type="button" data-key="down">↓</button>
    <button type="button" data-key="enter">⏎</button>
  </div>
  <div id="term"></div>
</div>
<div id="notice"><div class="box">
  <h2 id="noticeTitle">Terminal unavailable</h2>
  <p id="noticeMsg"></p>
  <div id="noticeActions"></div>
</div></div>

<!-- Vendored, offline. xterm 5.x UMD → window.Terminal; fit → window.FitAddon.FitAddon -->
<script src="vendor/xterm.js"></script>
<script src="vendor/xterm-addon-fit.js"></script>
<script src="network.js?v=41"></script>
<script src="terminal.js"></script>
</body>
</html>
